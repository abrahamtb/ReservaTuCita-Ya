name: CI

on:
  push:
    branches:
      - develop
      - integracion/frontend-final-rg018-rg030
  pull_request:
    branches:
      - develop

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/ReservaTuCitaYa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/ReservaTuCitaYa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://localhost:7233

  backend:
    name: Backend build and tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend/ReservaTuCitaYa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ReservaTuCitaYa.sln

      - name: Build
        run: dotnet build ReservaTuCitaYa.sln --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test ReservaTuCitaYa.UnitTests/ReservaTuCitaYa.UnitTests.csproj --configuration Release --no-build --verbosity normal --logger "console;verbosity=detailed"

      - name: Integration tests
        run: dotnet test ReservaTuCitaYa.IntegrationTests/ReservaTuCitaYa.IntegrationTests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=integration.trx" -m:1
        env:
          ConnectionStrings__DefaultConnection: 'Server=(localdb)\MSSQLLocalDB;Database=ReservaTuCitaYa_CI_Bootstrap;Trusted_Connection=True;TrustServerCertificate=True;'

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: backend/ReservaTuCitaYa/ReservaTuCitaYa.IntegrationTests/TestResults/integration.trx
          if-no-files-found: error
